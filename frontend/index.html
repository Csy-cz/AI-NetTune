<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="nettune-release" content="netscope-20261126" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=nettune-topology-2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NetScope·校园无线网络监测、研判与优化处置平台：自然语言提问、故障研判与证据链、区域电磁频谱态势预测、方案对比与闭环优化。" />
    <meta name="theme-color" id="ain-theme-color" content="#edf5fc" />
    <!-- 首帧主题：在样式与模块加载前落 data-theme / color-scheme，避免刷新闪白。
         取值与 src/theme/themeMode.ts（键 ain-theme-mode，light|dark|system）保持一致。 -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("ain-theme-mode") || "system";
          var dark = mode === "dark" || (mode === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? "dark" : "light";
          root.dataset.themeMode = mode;
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.getElementById("ain-theme-color");
          if (meta) meta.setAttribute("content", dark ? "#0a121e" : "#edf5fc");
        } catch (error) {
          /* 隐私模式等场景读不到 localStorage：保持默认浅色即可。 */
        }
      })();
    </script>
    <title>NetScope·校园无线网络监测、研判与优化处置平台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
